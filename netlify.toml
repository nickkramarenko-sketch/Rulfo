# Deploys the 24hrcrossdock.com site from the site/ folder (built by site-src/build.py).
[build]
  publish = "site"

[[redirects]]
  from = "/thanks.html"
  to = "/thanks/"
  status = 301
[[redirects]]
  from = "/north-highlands/*"
  to = "/sacramento/"
  status = 301
# Harrisburg dock pages moved from /middletown/ to /harrisburg/ (D3). Do not add a /harrisburg/* -> /middletown/ rule: it would loop.
[[redirects]]
  from = "/middletown/*"
  to = "/harrisburg/:splat"
  status = 301
[[redirects]]
  from = "/sparks/*"
  to = "/reno/"
  status = 301
# Reno service pages renamed (D4)
[[redirects]]
  from = "/reno/cross-dock/*"
  to = "/reno/cross-docking/"
  status = 301
[[redirects]]
  from = "/reno/transload/*"
  to = "/reno/transloading/"
  status = 301
[[redirects]]
  from = "/reno/delivery/*"
  to = "/reno/pickups-deliveries/"
  status = 301
[[redirects]]
  from = "/technology/*"
  to = "/client-portal/"
  status = 301
[[redirects]]
  from = "/reno/trailers/*"
  to = "/reno/"
  status = 301
